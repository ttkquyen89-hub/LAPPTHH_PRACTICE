<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Học Tập: Cân Bằng Phương Trình Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to hide number input spin buttons */
        input[type="text"]::-webkit-outer-spin-button,
        input[type="text"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 py-8 px-4 font-sans text-gray-800">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header phiếu học tập -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 md:p-8 text-white">
            <h1 class="text-2xl md:text-3xl font-bold text-center mb-2">
                Phiếu Học Tập: Cân Bằng Phương Trình Hóa Học
            </h1>
            <p class="text-center text-blue-100 max-w-2xl mx-auto">
                Nhập hệ số thích hợp vào khoảng trống trước mỗi phân tử. 
                Lưu ý: Đối với hệ số 1, bạn có thể để trống không cần điền.
            </p>
        </div>

        <!-- Container chứa các phương trình -->
        <div class="p-4 md:p-8 bg-gray-50/50">
            <div id="equations-container" class="space-y-4">
                <!-- Nội dung sẽ được tạo tự động bằng JavaScript -->
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-gray-100 p-4 text-center border-t border-gray-200">
            <button 
                onclick="window.location.reload()" 
                class="inline-flex items-center px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors shadow-sm text-sm font-medium"
            >
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Làm lại từ đầu
            </button>
        </div>
    </div>

    <script>
        // Danh sách các phương trình hóa học
        const EQUATIONS = [
            { id: 1, compounds: ['H₂', 'O₂', 'H₂O'], ops: [' + ', ' ⟶ ', ''], correct: [2, 1, 2] },
            { id: 2, compounds: ['Fe', 'O₂', 'Fe₃O₄'], ops: [' + ', ' ⟶ ', ''], correct: [3, 2, 1] },
            { id: 3, compounds: ['P', 'O₂', 'P₂O₅'], ops: [' + ', ' ⟶ ', ''], correct: [4, 5, 2] },
            { id: 4, compounds: ['Al', 'HCl', 'AlCl₃', 'H₂'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [2, 6, 2, 3] },
            { id: 5, compounds: ['CH₄', 'O₂', 'CO₂', 'H₂O'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [1, 2, 1, 2] },
            { id: 6, compounds: ['Fe₂O₃', 'CO', 'Fe', 'CO₂'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [1, 3, 2, 3] },
            { id: 7, compounds: ['KClO₃', 'KCl', 'O₂'], ops: [' ⟶ ', ' + ', ''], correct: [2, 2, 3] },
            { id: 8, compounds: ['KMnO₄', 'K₂MnO₄', 'MnO₂', 'O₂'], ops: [' ⟶ ', ' + ', ' + ', ''], correct: [2, 1, 1, 1] },
            { id: 9, compounds: ['Fe₂O₃', 'HCl', 'FeCl₃', 'H₂O'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [1, 6, 2, 3] },
            { id: 10, compounds: ['Al₂O₃', 'H₂SO₄', 'Al₂(SO₄)₃', 'H₂O'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [1, 3, 1, 3] },
            { id: 11, compounds: ['NaOH', 'H₂SO₄', 'Na₂SO₄', 'H₂O'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [2, 1, 1, 2] },
            { id: 12, compounds: ['Ca(OH)₂', 'HCl', 'CaCl₂', 'H₂O'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [1, 2, 1, 2] },
            { id: 13, compounds: ['BaCl₂', 'H₂SO₄', 'BaSO₄', 'HCl'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [1, 1, 1, 2] },
            { id: 14, compounds: ['Na₂CO₃', 'HCl', 'NaCl', 'H₂O', 'CO₂'], ops: [' + ', ' ⟶ ', ' + ', ' + ', ''], correct: [1, 2, 2, 1, 1] },
            { id: 15, compounds: ['CaCO₃', 'HCl', 'CaCl₂', 'H₂O', 'CO₂'], ops: [' + ', ' ⟶ ', ' + ', ' + ', ''], correct: [1, 2, 1, 1, 1] },
            { id: 16, compounds: ['FeCl₃', 'NaOH', 'Fe(OH)₃', 'NaCl'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [1, 3, 1, 3] },
            { id: 17, compounds: ['CuSO₄', 'NaOH', 'Cu(OH)₂', 'Na₂SO₄'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [1, 2, 1, 1] },
            { id: 18, compounds: ['C₂H₅OH', 'O₂', 'CO₂', 'H₂O'], ops: [' + ', ' ⟶ ', ' + ', ''], correct: [1, 3, 2, 3] }
        ];

        // Biểu tượng (Icons)
        const ICONS = {
            check: `<svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`,
            x: `<svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>`,
            alert: `<svg class="w-5 h-5 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`
        };

        // Hàm render giao diện
        function renderEquations() {
            const container = document.getElementById('equations-container');
            let html = '';

            EQUATIONS.forEach((eq, index) => {
                let equationHtml = '';
                eq.compounds.forEach((compound, compIndex) => {
                    equationHtml += `
                        <div class="flex items-center">
                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="2"
                                data-eq-index="${index}"
                                data-comp-index="${compIndex}"
                                class="coef-input mx-1 p-0 h-8 w-8 text-center bg-transparent outline-none transition-all font-sans text-xl font-bold placeholder-transparent border-b-2 border-gray-400 border-dashed focus:border-solid focus:border-indigo-500 hover:border-gray-500"
                                placeholder="?"
                            />
                            <span class="tracking-wide">${compound}</span>
                        </div>
                        <span class="mx-2 text-gray-500">${eq.ops[compIndex]}</span>
                    `;
                });

                html += `
                    <div class="relative">
                        <!-- Số thứ tự -->
                        <div class="absolute top-4 -left-1 md:-left-4 w-6 h-6 rounded-full bg-indigo-100 text-indigo-800 hidden md:flex items-center justify-center text-xs font-bold shadow-sm z-10">
                            ${index + 1}
                        </div>
                        
                        <!-- Box phương trình -->
                        <div id="row-${index}" class="p-4 rounded-xl border border-gray-200 bg-white hover:shadow-md transition-all duration-300 shadow-sm flex flex-col md:flex-row gap-4 items-center">
                            
                            <div class="flex flex-wrap items-center justify-center md:justify-start flex-1 text-lg md:text-xl font-medium font-serif">
                                ${equationHtml}
                            </div>

                            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                                <!-- Box thông báo trạng thái -->
                                <div id="status-${index}" class="flex items-center min-w-[120px] justify-end empty:hidden"></div>
                                
                                <button
                                    data-eq-index="${index}"
                                    class="check-btn px-4 py-2 rounded-lg text-white font-semibold shadow-sm transition-all active:scale-95 bg-indigo-600 hover:bg-indigo-700"
                                >
                                    Kiểm tra
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            attachEventListeners();
        }

        // Hàm gắn sự kiện sau khi render HTML
        function attachEventListeners() {
            // Lắng nghe sự thay đổi trên các ô nhập (chỉ cho phép nhập số và đổi style)
            document.querySelectorAll('.coef-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const eqIndex = e.target.getAttribute('data-eq-index');
                    // Chỉ cho phép nhập số
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    // Style lại ô input nếu có chữ/không có chữ
                    if (e.target.value !== '') {
                        e.target.classList.add('text-indigo-700', 'border-indigo-600', 'border-solid');
                        e.target.classList.remove('border-gray-400', 'border-dashed');
                    } else {
                        e.target.classList.remove('text-indigo-700', 'border-indigo-600', 'border-solid');
                        e.target.classList.add('border-gray-400', 'border-dashed');
                    }

                    // Reset trạng thái khi người dùng sửa số
                    resetStatus(eqIndex);
                });
            });

            // Lắng nghe sự kiện click nút kiểm tra
            document.querySelectorAll('.check-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const eqIndex = parseInt(e.target.getAttribute('data-eq-index'));
                    checkAnswer(eqIndex);
                });
            });
        }

        // Hàm đưa box về trạng thái chưa kiểm tra
        function resetStatus(index) {
            const row = document.getElementById(`row-${index}`);
            const statusBox = document.getElementById(`status-${index}`);
            const btn = document.querySelector(`.check-btn[data-eq-index="${index}"]`);

            // Khôi phục class mặc định
            row.className = "p-4 rounded-xl border transition-all duration-300 shadow-sm flex flex-col md:flex-row gap-4 items-center border-gray-200 bg-white hover:shadow-md";
            btn.className = "check-btn px-4 py-2 rounded-lg text-white font-semibold shadow-sm transition-all active:scale-95 bg-indigo-600 hover:bg-indigo-700";
            statusBox.innerHTML = '';
        }

        // Hàm kiểm tra đáp án
        function checkAnswer(index) {
            const eq = EQUATIONS[index];
            const inputs = document.querySelectorAll(`.coef-input[data-eq-index="${index}"]`);
            
            // Lấy giá trị, ngầm hiểu ô trống ('') là 1
            const userCoefs = Array.from(inputs).map(input => {
                return input.value === '' ? 1 : Number(input.value);
            });

            // 1. Kiểm tra khớp chính xác hoàn toàn
            let isPerfect = true;
            for (let i = 0; i < userCoefs.length; i++) {
                if (userCoefs[i] !== eq.correct[i]) {
                    isPerfect = false;
                    break;
                }
            }

            if (isPerfect) {
                updateUI(index, 'correct');
                return;
            }

            // 2. Kiểm tra đúng tỉ lệ nhưng chưa rút gọn
            let isProportional = true;
            const ratio = userCoefs[0] / eq.correct[0];
            for (let i = 0; i < userCoefs.length; i++) {
                if (userCoefs[i] / eq.correct[i] !== ratio) {
                    isProportional = false;
                    break;
                }
            }

            if (isProportional) {
                updateUI(index, 'unsimplified');
                return;
            }

            // 3. Sai hoàn toàn
            updateUI(index, 'incorrect');
        }

        // Hàm cập nhật giao diện (màu sắc, icon) theo kết quả
        function updateUI(index, status) {
            const row = document.getElementById(`row-${index}`);
            const statusBox = document.getElementById(`status-${index}`);
            const btn = document.querySelector(`.check-btn[data-eq-index="${index}"]`);

            // Reset class trước
            row.className = "p-4 mb-4 rounded-xl border transition-all duration-300 shadow-sm flex flex-col md:flex-row gap-4 items-center";
            btn.className = "check-btn px-4 py-2 rounded-lg text-white font-semibold shadow-sm transition-all active:scale-95";

            if (status === 'correct') {
                row.classList.add('border-green-300', 'bg-green-50');
                btn.classList.add('bg-green-500', 'hover:bg-green-600');
                statusBox.innerHTML = `<span class="flex items-center text-sm text-green-600 font-semibold">${ICONS.check}<span class="ml-1">Chính xác!</span></span>`;
            } else if (status === 'incorrect') {
                row.classList.add('border-red-300', 'bg-red-50');
                btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                statusBox.innerHTML = `<span class="flex items-center text-sm text-red-600 font-semibold">${ICONS.x}<span class="ml-1">Chưa đúng</span></span>`;
            } else if (status === 'unsimplified') {
                row.classList.add('border-yellow-300', 'bg-yellow-50');
                btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                statusBox.innerHTML = `<span class="flex items-center text-sm text-yellow-600 font-semibold">${ICONS.alert}<span class="ml-1">Hãy rút gọn!</span></span>`;
            }
        }

        // Khởi tạo khi tải trang
        window.onload = () => {
            renderEquations();
        };
    </script>
</body>
</html>
